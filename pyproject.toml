[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-docs"
version = "0.1.0"
description = "Documentação de dados centralizada"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["data_docs*"]
namespaces = true

[tool.setuptools.package-data]
"data_docs" = ["**/*.md"]